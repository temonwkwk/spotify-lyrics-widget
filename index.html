<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotify Lyrics Widget</title><link rel="stylesheet" href="style.css"></head><body><main class="card"><header><div class="brand"><span class="dot"></span><div><b>SPOTIFY LYRICS</b><small>NOW PLAYING</small></div></div><nav><button id="min" aria-label="Minimize">−</button><button id="close" aria-label="Close">×</button></nav></header><section class="now"><div class="album" aria-hidden="true">♫</div><div class="meta"><h1 id="title">Belum ada lagu</h1><p id="artist">Hubungkan Spotify untuk mulai</p></div><span class="live">●</span></section><div class="lyrics"><div class="line muted">Lyrics akan muncul di sini</div><div class="line active">Tekan CONNECT untuk menghubungkan</div><div class="line muted">Widget mengikuti lagu yang sedang diputar</div></div><div class="progress"><i></i></div><div class="time"><span>0:00</span><span id="status">DEMO MODE</span><span>0:00</span></div><footer><button class="spotify" id="connect">♫ &nbsp; CONNECT SPOTIFY</button><button class="gear" id="settings" aria-label="Settings">⚙</button></footer><div class="modal" id="modal"><div class="modal-box"><h2>Connect Spotify</h2><p>Masukkan Client ID dari Spotify Developer Dashboard.</p><input id="client-id" placeholder="Spotify Client ID" autocomplete="off"><div class="modal-actions"><button id="cancel-connect">BATAL</button><button id="submit-connect">LANJUT</button></div></div></div></main><script src="lyrics-sync.js"></script><script src="renderer.js"></script></body></html>
